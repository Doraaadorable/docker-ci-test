# Local stack: the classifier plus Postgres for the /visits counter.
services:
  app:
    build: .
    image: digits-classifier
    ports:
      - "5050:5050"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
