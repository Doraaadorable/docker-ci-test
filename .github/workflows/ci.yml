name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/doraaadorable/docker-ci-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests against the API schema
        run: docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /k8s

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t digits-classifier:ci .
      - name: Run as in Kubernetes (read-only, no capabilities)
        run: docker run -d --name app --read-only --cap-drop ALL --security-opt no-new-privileges -p 5050:5050 digits-classifier:ci
      - name: Smoke test
        run: scripts/smoke_test.sh
      - name: Container logs
        if: always()
        run: docker logs app

  publish:
    runs-on: ubuntu-latest
    needs: [image, manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Push image tagged with the commit
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Smoke-test the published image
        run: |
          docker run -d --name published --read-only --cap-drop ALL -p 5050:5050 "$IMAGE:sha-${{ github.sha }}"
          scripts/smoke_test.sh
      - name: Promote the tested image to latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:sha-${{ github.sha }}"
